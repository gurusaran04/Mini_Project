; ===================================================================
;  ASTERISK PJSIP CONFIGURATION (pjsip.conf)
;  Configures Transports, Testing Extensions 1001 & 1002, and PSTN SIP Trunk
; ===================================================================

[global]
type=global
user_agent=Asterisk PBX - St. Jude Tech Affairs

; UDP Transport on Port 5060
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TCP Transport on Port 5060
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; -------------------------------------------------------------------
; Extension 1001 (Student / Parent Softphone)
; -------------------------------------------------------------------
[1001]
type=endpoint
context=main-menu
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=password1001

[1001]
type=aor
max_contacts=5

; -------------------------------------------------------------------
; Extension 1002 (Faculty Advisor Softphone - Prof. Madhan)
; -------------------------------------------------------------------
[1002]
type=endpoint
context=main-menu
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
username=1002
password=password1002

[1002]
type=aor
max_contacts=5

; -------------------------------------------------------------------
; Public PSTN Carrier SIP Trunk (Twilio / Exotel / Zadarma / SIM Gateway)
; -------------------------------------------------------------------
[pstn-carrier-trunk]
type=endpoint
context=main-menu
disallow=all
allow=ulaw
allow=alaw
allow=g729
aors=pstn-carrier-trunk

[pstn-carrier-trunk]
type=aor
contact=sip:18004258899@127.0.0.1:5060

; -------------------------------------------------------------------
; Anonymous / Inbound Helpline Endpoint
; -------------------------------------------------------------------
[anonymous]
type=endpoint
context=main-menu
disallow=all
allow=ulaw
allow=alaw
