; ===================================================================
;  ASTERISK DIALPLAN CONFIGURATION (extensions.conf)
;  St. Jude Tech Affairs AI IVR Student Leave & OD Management System
; ===================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
FACULTY_EXTEN=1002
ATTENDANCE_EXTEN=1001

[main-menu]
; Entry Extension for Inbound Helpline & Softphone Testing
exten => s,1,NoOp(--- INBOUND CALL RECEIVED ON ASTERISK IVR HELPLINE ---)
 same => n,Answer()
 same => n,Wait(1)
 same => n(menu),NoOp(--- PLAYING CUSTOM IVR MAIN MENU ---)
 ; Voice Prompt: "Press 1 for Leave, Press 2 for On-Duty, or Press 3 for Direct Interaction with the Faculty."
 same => n,Background(welcome)
 same => n,WaitExten(8)

; Direct Extension Entries (e.g., dialing 1000 or 18004258899 directly)
exten => 1000,1,Goto(s,1)
exten => 18004258899,1,Goto(s,1)

; -------------------------------------------------------------------
; DTMF Key 1: Leave Request
; -------------------------------------------------------------------
exten => 1,1,NoOp(--- DTMF KEY 1 PRESSED: LEAVE REQUEST ---)
 same => n,Playback(connecting) ; "Connecting to the attendance department"
 same => n,Dial(PJSIP/${ATTENDANCE_EXTEN},20)
 same => n,Hangup()

; -------------------------------------------------------------------
; DTMF Key 2: On-Duty (OD) Request
; -------------------------------------------------------------------
exten => 2,1,NoOp(--- DTMF KEY 2 PRESSED: ON-DUTY (OD) REQUEST ---)
 same => n,Playback(connecting) ; "Connecting to the On-Duty coordination desk"
 same => n,Dial(PJSIP/${ATTENDANCE_EXTEN},20)
 same => n,Hangup()

; -------------------------------------------------------------------
; DTMF Key 3: Direct Interaction with Faculty (Prof. Madhan - Ext 1002)
; -------------------------------------------------------------------
exten => 3,1,NoOp(--- DTMF KEY 3 PRESSED: DIRECT FACULTY INTERACTION ---)
 same => n,Playback(transfer) ; Transferring call prompt
 same => n,Dial(PJSIP/${FACULTY_EXTEN},20)
 same => n,Hangup()

; -------------------------------------------------------------------
; Direct Dialing Extension 1001 & 1002
; -------------------------------------------------------------------
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

; -------------------------------------------------------------------
; Error Handling & Invalid Key / Timeout Prompts
; -------------------------------------------------------------------
exten => i,1,NoOp(--- INVALID KEY PRESSED ---)
 same => n,Playback(invalid) ; "Invalid selection. Please try again."
 same => n,Goto(s,menu)

exten => t,1,NoOp(--- IVR RESPONSE TIMEOUT ---)
 same => n,NoOp(No response received within timeout window.)
 same => n,Goto(s,menu)
