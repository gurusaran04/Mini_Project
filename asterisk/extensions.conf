; ===================================================================
;  ASTERISK 22 DIALPLAN CONFIGURATION (extensions.conf)
;  St. Jude Tech Affairs AI IVR Student Leave & OD Management System
; ===================================================================

[general]
static=yes
writeprotect=no

[globals]
WEBHOOK_SERVER=http://localhost:3000/api/webhook/vapi-end-call

[default]
; Inbound Parent Call Context
exten => 18004258899,1,NoOp(--- INBOUND CALL RECEIVED ON ASTERISK IVR HELPLINE ---)
 same => n,Set(CALLER_ID=${CALLERID(num)})
 same => n,NoOp(Captured Caller ID: ${CALLER_ID})
 same => n,Answer()
 same => n,Wait(1)
 ; Updated Audio Greeting Prompt: "Hello, what is your query? Give information about Leave, OD or contact the Advisor."
 same => n,Background(hello-what-is-your-query-leave-od-advisor)
 same => n,WaitExten(5)

; Option 1: Leave Request (DTMF Key 1)
exten => 1,1,NoOp(Parent selected LEAVE Request)
 same => n,Set(REQ_TYPE=Leave)
 same => n,Background(enter-absence-reason)
 same => n,Record(/tmp/reason_${CALLERID(num)}.wav,3,30)
 same => n,AGI(asterisk_agi_handler.py,${CALLERID(num)},Leave,Medical illness or emergency absence)
 same => n,Playback(leave-request-submitted-successfully)
 same => n,Hangup()

; Option 2: On-Duty (OD) Request (DTMF Key 2)
exten => 2,1,NoOp(Parent selected ON-DUTY Request)
 same => n,Set(REQ_TYPE=OD)
 same => n,AGI(asterisk_agi_handler.py,${CALLERID(num)},OD,Attending Academic Event / Competition)
 same => n,Playback(od-request-submitted-successfully)
 same => n,Hangup()

; Option 3: Contact Class Advisor Prof. Madhan (DTMF Key 3)
exten => 3,1,NoOp(Parent requested to contact Class Advisor Prof. Madhan)
 same => n,Playback(connecting-to-class-advisor-prof-madhan)
 same => n,Dial(PJSIP/ADV-MADHAN-01,20)
 same => n,Hangup()

; Invalid Option Timeout
exten => i,1,Playback(invalid-option)
 same => n,Goto(18004258899,1)

exten => t,1,Playback(goodbye)
 same => n,Hangup()
