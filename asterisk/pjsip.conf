; ===================================================================
;  ASTERISK 22 PJSIP CONFIGURATION (pjsip.conf)
;  Configures SIP Channels and Phone Extensions for Asterisk PBX
; ===================================================================

[global]
type=global
user_agent=Asterisk PBX - St. Jude Tech Affairs

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Virtual Helpline Extension 18004258899
[18004258899]
type=endpoint
context=default
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=auth18004258899
aors=aor18004258899

[auth18004258899]
type=auth
auth_type=userpass
password=securepass123
username=18004258899

[aor18004258899]
type=aor
max_contacts=10
